<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1990" viewBox="0 0 1000 1990" role="img" aria-labelledby="title desc">
<title id="title">Gun Fight Intel 8080 memory map</title><desc id="desc">Sea Wolf II style card memory map with RAM, display and four original Gun Fight ROM chips.</desc>
<rect x="0" y="0" width="1000" height="1990" rx="0" fill="#0b1621" stroke="#0b1621" stroke-width="1"/>
<text x="35" y="76" fill="#f4f7fa" font-size="54" font-weight="bold" font-family="Georgia,serif" text-anchor="start">GUN FIGHT</text>
<text x="35" y="113" fill="#a9c1d4" font-size="19" font-weight="normal" font-family="Arial, sans-serif" text-anchor="start">1975 MIDWAY / DNA · INTEL 8080 ADDRESS SPACE</text>
<g transform="translate(790 12) scale(.85)" stroke-linecap="round" stroke-linejoin="round" aria-label="Crouching Gun Fight marquee cowboy">
  <!-- Back leg thrust far to the left, with boot turned outward -->
  <path d="M88 80 Q69 85 49 95 L18 102 L3 109 L10 115 L35 111 L66 105 L91 96 Z" fill="#bd9d76" stroke="#8d7d64" stroke-width="2"/>
  <path d="M18 101 L1 101 L1 111 L22 112 L33 108" fill="#498c94" stroke="#285963" stroke-width="2"/>
