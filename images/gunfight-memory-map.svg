<text x="250" y="202" fill="#f3f6fa" font-size="25" font-weight="bold" font-family="Arial, sans-serif" text-anchor="start">Unmapped / Open Bus</text>
<text x="46" y="232" fill="#e8f2fa" font-size="18" font-weight="normal" font-family="Arial, sans-serif" text-anchor="start">No program ROM or working RAM is identified above the bitmap display.</text>
<rect x="878" y="176" width="75" height="27" rx="14" fill="#07111c" stroke="#b4c9d8" stroke-width="1"/><text x="915.5" y="195" fill="#eaf3fb" font-size="13" font-weight="normal" font-family="monospace" text-anchor="middle">48 KB</text>
<rect x="45" y="243" width="910" height="57" rx="10" fill="#07111b" stroke="#b4c9d8" stroke-width="1"/>
<text x="62" y="266" fill="#d6e4f0" font-size="15" font-weight="normal" font-family="monospace" text-anchor="start">UNMAPPED_HIGH_START  equ $4000</text><text x="62" y="291" fill="#d6e4f0" font-size="15" font-weight="normal" font-family="monospace" text-anchor="start">UNMAPPED_HIGH_END    equ $FFFF</text>
<rect x="25" y="335" width="950" height="205" rx="18" fill="#196786" stroke="#b4c9d8" stroke-width="1"/>
<text x="46" y="375" fill="#d8e7f3" font-size="21" font-weight="normal" font-family="monospace" text-anchor="start">$2400–$3FFF</text>
<text x="250" y="375" fill="#f3f6fa" font-size="25" font-weight="bold" font-family="Arial, sans-serif" text-anchor="start">Bitmap Display</text>
<text x="46" y="405" fill="#e8f2fa" font-size="18" font-weight="normal" font-family="Arial, sans-serif" text-anchor="start">Native drawing, formatted text and stack-driven screen clearing.</text>
