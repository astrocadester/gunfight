  <!-- Back arm and holster -->
  <path d="M52 69 Q43 74 40 89" fill="none" stroke="#8db5a8" stroke-width="10"/>
  <path d="M39 87 L35 98" fill="none" stroke="#e3bd83" stroke-width="5"/>
  <!-- Legs and boots -->
  <path d="M53 93 L43 112 L34 119" stroke="#8a6347" stroke-width="11" fill="none"/>
