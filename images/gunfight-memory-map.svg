  <path d="M77 82 L102 85" fill="none" stroke="#6c4b36" stroke-width="5"/>
  <path d="M69 77 L61 91 L72 92 L80 81" fill="#71543f"/>
  <!-- Leaning turquoise shirt with a dark vest -->
  <path d="M86 45 Q98 43 106 49 L115 64 L108 82 L82 84 L73 69 L79 53 Z" fill="#87ada4" stroke="#4d756d" stroke-width="2"/>
  <path d="M83 49 L93 51 L97 78 L86 79 L78 65" fill="#587c75"/>
  <path d="M101 51 L107 52 L109 72 L99 80 L96 77 Z" fill="#5b746d"/>
  <path d="M82 82 L109 80" stroke="#bd9970" stroke-width="3"/>
  <!-- Raised near shoulder, two sleeves and hands aiming to the right -->
  <path d="M103 54 Q115 50 129 54 L150 49 L158 54 L148 61 L130 65 L113 66" fill="#8eb8af" stroke="#4b7772" stroke-width="2"/>
  <path d="M115 65 L139 64 L156 55" fill="none" stroke="#6b8c83" stroke-width="9"/>
  <path d="M115 65 L139 64 L156 55" fill="none" stroke="#97c1b3" stroke-width="5"/>
  <path d="M148 49 L159 47 L163 53 L155 58 L147 56" fill="#d0b28e" stroke="#8c7055" stroke-width="1.5"/>
  <!-- Small handgun held horizontally -->
  <path d="M157 46 L176 42 L186 42 L188 46 L173 50 L162 51" fill="#9faca9" stroke="#465960" stroke-width="2"/>
  <path d="M161 50 L160 61 L165 61 L170 49" fill="#566970"/>
  <path d="M164 51 L171 54" stroke="#ced4c5" stroke-width="2"/>
  <!-- Far arm bracing the shot -->
  <path d="M89 52 Q102 57 111 69 L133 69 L146 57" fill="none" stroke="#5f8a83" stroke-width="11"/>
  <path d="M89 52 Q102 57 111 69 L133 69 L146 57" fill="none" stroke="#9abfb5" stroke-width="7"/>
  <path d="M141 57 L153 53 L158 57 L148 62" fill="#cfaf86"/>
  <!-- Face in right-facing profile, with black hair below the hat -->
  <path d="M103 34 Q110 31 119 36 L120 47 L113 56 L104 53 L98 44 Z" fill="#342e29" stroke="#211f20" stroke-width="2"/>
  <path d="M105 35 L122 36 L128 41 L123 45 L118 47 L116 54 L107 55 L101 49 Z" fill="#d4b78a" stroke="#8a7054" stroke-width="1.6"/>
  <path d="M116 43 L118 43" stroke="#25302b" stroke-width="2.5"/>
  <path d="M123 46 L129 48 L124 50" fill="#ccac80"/>
  <path d="M106 51 L110 56 L104 57" fill="#30312d"/>
  <!-- Flat brim and shallow dark crown, characteristic marquee profile -->
  <path d="M91 29 L95 13 Q108 8 120 14 L124 27 Z" fill="#3b302b" stroke="#302c2b" stroke-width="2"/>
  <path d="M94 23 L123 25" stroke="#82b3b2" stroke-width="4"/>
  <path d="M80 29 Q97 25 115 27 L140 29 L137 34 L112 36 L85 34 Q78 33 80 29 Z" fill="#403735" stroke="#2b2829" stroke-width="2"/>
  <path d="M93 30 L129 31" stroke="#9db9b5" stroke-width="3"/>
</g>
<line x1="30" x2="970" y1="144" y2="144" stroke="#94afc1"/>
<rect x="25" y="162" width="950" height="156" rx="18" fill="#3d4855" stroke="#b4c9d8" stroke-width="1"/>
