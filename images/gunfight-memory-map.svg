<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1235" viewBox="0 0 1200 1235" role="img" aria-labelledby="title description"><title id="title">Gun Fight Intel 8080 memory map</title><desc id="description">Four original 1 KB ROM devices, working RAM, generated graphics and bitmap display memory.</desc><rect width="1200" height="1235" fill="#0e1721"/><style>.title{fill:#f4f7fb;font:700 42px Georgia,serif}.subtitle{fill:#aac1d5;font:18px Arial,sans-serif}.range{fill:#ffffff;font:23px monospace}.heading{fill:#ffffff;font:700 24px Arial,sans-serif}.body{fill:#e2edf5;font:18px Arial,sans-serif}.small{fill:#c7d8e6;font:16px monospace}</style><text class="title" x="42" y="67">GUN FIGHT</text><text class="subtitle" x="44" y="104">1975 MIDWAY / DNA  •  INTEL 8080 ADDRESS SPACE</text><line x1="36" y1="130" x2="1164" y2="130" stroke="#7796ad" stroke-width="2"/><!-- Decorative cowboy emblem, simplified from the left-hand cowboy on the original Gun Fight marquee. -->
<g transform="translate(1015 9) scale(.88)" stroke-linecap="round" stroke-linejoin="round" aria-label="Gun Fight cowboy emblem">
  <!-- Long-brim hat, side profile -->
  <path d="M39 35 Q49 29 66 30 L78 28 L83 34 L89 39 L110 40 Q113 43 106 46 L77 47 L34 45 Q23 43 31 39 Z" fill="#cfa46a" stroke="#f1d2a2" stroke-width="2"/>
  <path d="M49 33 L53 18 Q66 11 80 18 L85 35 Z" fill="#8a6149" stroke="#ead1a3" stroke-width="2"/>
  <path d="M51 31 L83 34" stroke="#427369" stroke-width="5"/>
  <!-- Head/neck and brim shadow -->
  <path d="M61 45 L82 45 L83 54 L79 63 L69 69 L59 61 Z" fill="#e4c38e" stroke="#8b6244" stroke-width="2"/>
  <path d="M76 48 L85 49 L88 52 L81 54" fill="#e4c38e" stroke="#8b6244" stroke-width="2"/>
  <path d="M72 52 L74 52" stroke="#293a35" stroke-width="3"/>
  <path d="M64 60 L71 62 L67 67" fill="#695044"/>
  <!-- Torso, leather vest and diagonal belt -->
  <path d="M58 64 Q70 65 81 69 L87 89 L69 97 L49 88 Z" fill="#77a69c" stroke="#e3d1a8" stroke-width="2"/>
  <path d="M59 66 L70 93 L75 94 L65 69" fill="#77523b" stroke="#b88f62" stroke-width="1"/>
  <path d="M50 88 L83 92" stroke="#caa170" stroke-width="4"/>
