<rect x="45" y="418" width="910" height="105" rx="10" fill="#07111b" stroke="#b4c9d8" stroke-width="1"/>
<text x="62" y="444" fill="#d6e4f0" font-size="15" font-weight="normal" font-family="monospace" text-anchor="start">DISPLAY_RAM_BASE     equ $2400</text><text x="62" y="469" fill="#d6e4f0" font-size="15" font-weight="normal" font-family="monospace" text-anchor="start">DISPLAY_RAM_LIMIT    equ $4000</text><text x="62" y="494" fill="#d6e4f0" font-size="15" font-weight="normal" font-family="monospace" text-anchor="start">SCREEN_CLEAR_SP      equ $400F  ; temporary zero-fill stack</text>
<rect x="25" y="557" width="950" height="345" rx="18" fill="#1c6048" stroke="#b4c9d8" stroke-width="1"/>
