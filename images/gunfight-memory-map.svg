</g><g transform="translate(32 154)"><rect width="1136" height="95" rx="14" fill="#485565" stroke="#a5b7c4" stroke-width="1"/><text x="24" y="33" class="range">$4000–$FFFF</text><text x="270" y="33" class="heading">Unmapped</text><text x="24" y="65" class="body">Display clear uses SP=$400F; further mapping is not identified.</text></g>
<g transform="translate(32 264)"><rect width="1136" height="123" rx="14" fill="#145e4c" stroke="#a5b7c4" stroke-width="1"/><text x="24" y="33" class="range">$2400–$3FFF</text><text x="270" y="33" class="heading">Bitmap display and stack-driven clear</text><text x="24" y="65" class="body">Native graphics and text writers target the display.</text><text x="24" y="95" class="small">Screen clear temporarily uses SP=$400F; runtime stack starts at $2400.</text></g>
<g transform="translate(32 402)"><rect width="1136" height="152" rx="14" fill="#145e4c" stroke="#a5b7c4" stroke-width="1"/><text x="24" y="33" class="range">$2000–$23FF</text><text x="270" y="33" class="heading">Working RAM and expanded graphics</text><text x="24" y="65" class="body">$2000: VM cursor   $2002+: scores, state, controls and timers</text><text x="24" y="95" class="small">$202A/$203D: player records    $2100+: expanded graphics</text></g>
<g transform="translate(32 569)"><rect width="1136" height="88" rx="14" fill="#485565" stroke="#a5b7c4" stroke-width="1"/><text x="24" y="33" class="range">$1000–$1FFF</text><text x="270" y="33" class="heading">Unmapped</text><text x="24" y="65" class="body">No program ROM or working RAM is identified in this range.</text></g>
