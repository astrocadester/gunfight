<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1235" viewBox="0 0 1200 1235" role="img" aria-labelledby="title description"><title id="title">Gun Fight Intel 8080 memory map</title><desc id="description">Four original 1 KB ROM devices, working RAM, generated graphics and bitmap display memory.</desc><rect width="1200" height="1235" fill="#0e1721"/><style>.title{fill:#f4f7fb;font:700 42px Georgia,serif}.subtitle{fill:#aac1d5;font:18px Arial,sans-serif}.range{fill:#ffffff;font:23px monospace}.heading{fill:#ffffff;font:700 24px Arial,sans-serif}.body{fill:#e2edf5;font:18px Arial,sans-serif}.small{fill:#c7d8e6;font:16px monospace}</style><text class="title" x="42" y="67">GUN FIGHT</text><text class="subtitle" x="44" y="104">1975 MIDWAY / DNA  •  INTEL 8080 ADDRESS SPACE</text><line x1="36" y1="130" x2="1164" y2="130" stroke="#7796ad" stroke-width="2"/><g transform="translate(32 154)"><rect width="1136" height="95" rx="14" fill="#485565" stroke="#a5b7c4" stroke-width="1"/><text x="24" y="33" class="range">$4000–$FFFF</text><text x="270" y="33" class="heading">Beyond traced display use</text><text x="24" y="65" class="body">No ROM allocation established by the recovered program.</text></g>
<g transform="translate(32 264)"><rect width="1136" height="123" rx="14" fill="#145e4c" stroke="#a5b7c4" stroke-width="1"/><text x="24" y="33" class="range">$2400–$3FFF</text><text x="270" y="33" class="heading">Bitmap display and stack-driven clear</text><text x="24" y="65" class="body">Native graphics and text writers target the display.</text><text x="24" y="95" class="small">Screen clear temporarily uses SP=$400F; runtime stack starts at $2400.</text></g>
<g transform="translate(32 402)"><rect width="1136" height="152" rx="14" fill="#145e4c" stroke="#a5b7c4" stroke-width="1"/><text x="24" y="33" class="range">$2000–$23FF</text><text x="270" y="33" class="heading">Working RAM and expanded graphics</text><text x="24" y="65" class="body">$2000: VM cursor   $2002+: scores, state, controls and timers</text><text x="24" y="95" class="small">$202A/$203D: player records    $2100+: expanded graphics</text></g>
<g transform="translate(32 569)"><rect width="1136" height="88" rx="14" fill="#485565" stroke="#a5b7c4" stroke-width="1"/><text x="24" y="33" class="range">$1000–$1FFF</text><text x="270" y="33" class="heading">Outside the four original program ROMs</text><text x="24" y="65" class="body">ROM image ends at $0FFF; additional allocation not established.</text></g>
<g transform="translate(32 672)"><rect width="1136" height="111" rx="14" fill="#7b4529" stroke="#a5b7c4" stroke-width="1"/><text x="24" y="33" class="range">$0C00–$0FFF</text><text x="270" y="33" class="heading">7609e.bin — graphics and game data</text><text x="24" y="65" class="body">Packed images, font bytes, drawing tables and text.</text><text x="24" y="95" class="small">1 KB    SHA-1 de3f2e6841122bbe6e2fda5b87d37842c072289a</text></g>
<g transform="translate(32 798)"><rect width="1136" height="111" rx="14" fill="#7b4529" stroke="#a5b7c4" stroke-width="1"/><text x="24" y="33" class="range">$0800–$0BFF</text><text x="270" y="33" class="heading">7609f.bin — VM, scripts and tables</text><text x="24" y="65" class="body">$0821/$089B script roots  •  $097E input actions  •  $09AE word table</text><text x="24" y="95" class="small">1 KB    SHA-1 215b068663e431582591001cbe028929fa96d49f</text></g>
<g transform="translate(32 924)"><rect width="1136" height="111" rx="14" fill="#603a69" stroke="#a5b7c4" stroke-width="1"/><text x="24" y="33" class="range">$0400–$07FF</text><text x="270" y="33" class="heading">7609g.bin — game and drawing services</text><text x="24" y="65" class="body">Control actions, shooting, scoring, graphics and VM handlers.</text><text x="24" y="95" class="small">1 KB    SHA-1 c177e3f72db9af17ab99b2481448ca26318184b9</text></g>
<g transform="translate(32 1050)"><rect width="1136" height="111" rx="14" fill="#603a69" stroke="#a5b7c4" stroke-width="1"/><text x="24" y="33" class="range">$0000–$03FF</text><text x="270" y="33" class="heading">7609h.bin — native engine</text><text x="24" y="65" class="body">Reset/IRQ paths, object and video helpers; interpreter at $03A7.</text><text x="24" y="95" class="small">1 KB    SHA-1 99d01313e251818d336281700e206d9003c71dae</text></g><text class="subtitle" x="43" y="1200">ROM boundaries: original 1 KB chips. RAM/video regions: native address use; board mapping remains subject to schematics.</text></svg>