<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480"><rect width="940" height="480" fill="#101419"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="55" fill="#f0f4f8" font-size="28">Gun Fight — 8080 address-space investigation</text><text x="40" y="86" fill="#a7b4c4" font-size="15">PROVISIONAL — not a ROM-verified allocation map</text><rect x="40" y="120" width="150" height="305" fill="#1b2732" stroke="#6e859a"/><text x="54" y="143" fill="#e5edf5" font-size="15">$0000</text><text x="54" y="411" fill="#e5edf5" font-size="15">$FFFF</text><text x="224" y="175" fill="#e5edf5" font-size="19">64 KB Intel 8080 logical address space</text><text x="224" y="214" fill="#b7c6d6" font-size="16">ROM chip placements: pending ROM ordering and vector tracing</text><text x="224" y="250" fill="#b7c6d6" font-size="16">RAM and stack ownership: pending access cross-references</text><text x="224" y="286" fill="#b7c6d6" font-size="16">Video memory / shifter hardware: pending hardware correlation</text><text x="224" y="322" fill="#b7c6d6" font-size="16">I/O ports: pending IN / OUT inventory</text><text x="224" y="358" fill="#b7c6d6" font-size="16">Possible script storage / dispatch: not established</text><text x="40" y="457" fill="#8195a8" font-size="13">Do not infer ranges from Sea Wolf II: different CPU and board generation.</text></g></svg>