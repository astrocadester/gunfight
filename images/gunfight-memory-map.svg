<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1235" viewBox="0 0 1200 1235" role="img" aria-labelledby="title description"><title id="title">Gun Fight Intel 8080 memory map</title><desc id="description">Four original 1 KB ROM devices, working RAM, generated graphics and bitmap display memory.</desc><rect width="1200" height="1235" fill="#0e1721"/><style>.title{fill:#f4f7fb;font:700 42px Georgia,serif}.subtitle{fill:#aac1d5;font:18px Arial,sans-serif}.range{fill:#ffffff;font:23px monospace}.heading{fill:#ffffff;font:700 24px Arial,sans-serif}.body{fill:#e2edf5;font:18px Arial,sans-serif}.small{fill:#c7d8e6;font:16px monospace}</style><text class="title" x="42" y="67">GUN FIGHT</text><text class="subtitle" x="44" y="104">1975 MIDWAY / DNA  •  INTEL 8080 ADDRESS SPACE</text><line x1="36" y1="130" x2="1164" y2="130" stroke="#7796ad" stroke-width="2"/><!-- Marquee cowboy: low, wide-legged gunslinger aiming right; inline vector artwork. -->
