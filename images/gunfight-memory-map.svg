<text x="46" y="627" fill="#e8f2fa" font-size="18" font-weight="normal" font-family="Arial, sans-serif" text-anchor="start">Interpreter state, player records, counters and unpacked graphics.</text>
<rect x="878" y="571" width="75" height="27" rx="14" fill="#07111c" stroke="#b4c9d8" stroke-width="1"/><text x="915.5" y="590" fill="#eaf3fb" font-size="13" font-weight="normal" font-family="monospace" text-anchor="middle">1 KB</text>
